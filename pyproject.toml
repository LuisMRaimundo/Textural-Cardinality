[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textural-dimension"
version = "1.1.0"
description = "Textural cardinality toolkit: symbolic vertical note, pitch, and pitch-class counts with exact event-boundary sampling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / project-local — see repository" }
authors = [{ name = "Luís Raimundo" }]
dependencies = [
    "music21>=9.0",
    "gradio>=4.0",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
textural-dimension = "textural_dimension.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["textural_dimension*", "iav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

